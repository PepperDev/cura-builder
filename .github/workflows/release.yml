name: Release

on:
  schedule:
    # Daily at 04:17 UTC. Off the hour to avoid scheduler congestion.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.versions.outputs.RELEASE_TAG }}
      build_id: ${{ steps.versions.outputs.BUILD_ID }}
      cura_tag: ${{ steps.versions.outputs.CURA_TAG }}
      alpine_version: ${{ steps.versions.outputs.ALPINE_VERSION }}
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/resolve-versions.sh

      - name: Check for an existing build
        id: check
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ steps.versions.outputs.BUILD_ID }}
        run: |
          set -euo pipefail
          # The tag carries the run number, so it is always new. Look for the
          # build id in the published asset names instead.
          tarball="cura-${BUILD_ID}-linux-x86_64.tar.gz"
          if gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate \
               --jq '.[].assets[].name' | grep -qxF "$tarball"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "A release already contains $tarball; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload resolved versions
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: versions.env
          retention-days: 1

  build:
    needs: resolve
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # armhf / linux/arm/v6 is intentionally absent: upstream Cura and
          # Uranium are marked `noarch !armhf`. Revisit after a source-level
          # check.
          - platform: linux/amd64
            arch: x86_64
            qemu: "false"
          - platform: linux/386
            arch: x86
            qemu: "false"
          - platform: linux/arm/v7
            arch: armv7
            qemu: "true"
          - platform: linux/arm64
            arch: aarch64
            qemu: "true"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download resolved versions
        uses: actions/download-artifact@v4
        with:
          name: versions
          path: .

      - name: Install QEMU user emulation
        if: matrix.qemu == 'true'
        run: |
          set -euo pipefail
          docker pull tonistiigi/binfmt:latest
          docker run --privileged --rm tonistiigi/binfmt:latest --install all
          docker run --privileged --rm tonistiigi/binfmt:latest
          test -e /proc/sys/fs/binfmt_misc/qemu-aarch64
          test -e /proc/sys/fs/binfmt_misc/qemu-arm

      - name: Set up Buildx
        if: matrix.platform != 'linux/amd64'
        run: |
          set -euo pipefail
          docker buildx create --name cura-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Build and package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: ./scripts/build-release.sh

      - name: Smoke test image
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
        run: |
          set -euo pipefail
          container="cura-smoke-${GITHUB_RUN_ID}-${ARCH}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --platform "$PLATFORM" --name "$container" \
            -e QT_QPA_PLATFORM=offscreen "cura-alpine:${BUILD_ID}-${ARCH}"
          # Give emulated builds time to load plugins and reach the event loop.
          sleep 45
          docker inspect -f '{{.State.Running}}' "$container" | grep -qx true
          if docker logs "$container" 2>&1 | grep -q 'Traceback'; then
            docker logs "$container"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/cura-*.tar.gz
            dist/cura-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, build]
    if: needs.resolve.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download resolved versions
        uses: actions/download-artifact@v4
        with:
          name: versions
          path: .

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate release metadata
        env:
          ARCHS: x86_64 x86 armv7 aarch64
        run: ./scripts/release-metadata.sh

      - name: Replace existing release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          # A tag without a release would make `gh release create` fail.
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              || echo "tag already removed"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
          BUILD_ID: ${{ needs.resolve.outputs.build_id }}
          CURA_TAG: ${{ needs.resolve.outputs.cura_tag }}
          ALPINE_VERSION: ${{ needs.resolve.outputs.alpine_version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            dist/cura-*.tar.gz \
            dist/cura-*.tar.gz.sha256 \
            "dist/SOURCES-${BUILD_ID}.txt" \
            --title "Cura ${CURA_TAG} on Alpine ${ALPINE_VERSION}" \
            --notes-file dist/release-notes.md
